name: Threat Modeler scan
description: Scans your project for security problems and fails the build when a change adds serious new ones.
branding:
  icon: shield
  color: blue

inputs:
  token:
    description: Your Threat Modeler API token. Store it as a repository secret.
    required: true
  api-url:
    description: The address of your Threat Modeler server, for example https://threat-modeler-bz87.onrender.com
    required: true
  fail-on:
    description: "When to fail the build. new-severe (default): a critical or high problem that is new compared with the main branch. new-any: any new problem. severe: any critical or high problem at all. never: report only."
    required: false
    default: new-severe
  path:
    description: Folder to scan, relative to the repository root.
    required: false
    default: .
  project:
    description: Project name. Defaults to the repository name (owner/repo).
    required: false
  baseline:
    description: "auto (default): a push to the default branch is the baseline that pull requests are compared with. Use true or false to force it."
    required: false
    default: auto
  comment:
    description: "Post the result as a comment on the pull request (updated on every push). Needs 'permissions: pull-requests: write' in the workflow. Use false to turn it off."
    required: false
    default: 'true'
  github-token:
    description: Token used only to write the pull request comment. The default is fine.
    required: false
    default: ${{ github.token }}
  timeout:
    description: Seconds to wait for the scan to finish.
    required: false
    default: '600'

outputs:
  risk-score:
    description: The risk score, 0 to 100.
    value: ${{ steps.scan.outputs.risk-score }}
  new-findings:
    description: How many problems are new compared with the main branch.
    value: ${{ steps.scan.outputs.new-findings }}
  new-severe:
    description: How many of the new problems are critical or high.
    value: ${{ steps.scan.outputs.new-severe }}
  report-url:
    description: A link to the full report.
    value: ${{ steps.scan.outputs.report-url }}

runs:
  using: composite
  steps:
    - id: scan
      shell: bash
      run: node "${{ github.action_path }}/scan.mjs"
      env:
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_API_URL: ${{ inputs.api-url }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
